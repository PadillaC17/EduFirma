name: Publicar EduVirtual Firmas v0.6.5

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4
      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compilar ejecutable autonomo para Windows x64
        shell: pwsh
        run: |
          dotnet publish EduFirma/EduFirma.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Empaquetar ejecutable y Assets
        shell: pwsh
        run: |
          Compress-Archive -Path dist/* -DestinationPath EduVirtualFirmas-Windows-x64.zip -Force
      - name: Crear checksum SHA256
        shell: pwsh
        run: |
          $hash = (Get-FileHash "dist/EduFirma.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  EduFirma.exe" | Set-Content -Path "dist/EduFirma.exe.sha256" -Encoding ascii
      - name: Publicar Release (solo si no existe)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.6.5 *> $null
          if ($LASTEXITCODE -eq 0) { Write-Error "Ya existe v0.6.5. No se sobreescribe."; exit 1 }
          gh release create v0.6.5 "EduVirtualFirmas-Windows-x64.zip" "dist/EduFirma.exe.sha256" --title "EduVirtual Firmas v0.6.5 (experimental)" --notes "Versión experimental Windows x64: visor PDF integrado con selección de página y posición del sello mediante clic; firma PDF con P12. Verificar externamente las firmas. Sin firma Authenticode." --target "${{ github.sha }}" --latest
