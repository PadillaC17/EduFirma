name: Compilar EduFirma Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Generar icono EduFirma
        shell: pwsh
        run: ./tools/create-icon.ps1
      - name: Publicar EXE autonomo
        shell: pwsh
        run: dotnet publish EduFirma/EduFirma.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o dist
      - name: Incluir logo junto al EXE
        shell: pwsh
        run: |
          $assets = "EduFirma/Assets"
          New-Item -ItemType Directory -Force -Path "dist/Assets" | Out-Null
          $preferred = @("MarcaEduVirtual.png", "LogoEduVirtual.png", "MarcaEduVirtual.jpg")
          $found = $preferred | Where-Object { Test-Path (Join-Path $assets $_) }
          if (-not $found) {
            Write-Error "Falta el logo en EduFirma/Assets. Subir MarcaEduVirtual.png al repositorio."
            exit 1
          }
          foreach ($name in $found) {
            Copy-Item (Join-Path $assets $name) (Join-Path "dist/Assets" $name) -Force
          }
          Write-Host "Logos incluidos: $($found -join ', ')"
      - name: Subir ejecutable
        uses: actions/upload-artifact@v4
        with:
          name: EduFirma-Windows-x64
          path: dist/
