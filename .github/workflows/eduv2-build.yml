name: Compilar EduVirtual Firmas 2
on:
  push:
    branches: [feature/multifirma-incremental]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publicar nuevo motor incremental
        run: dotnet publish EduVirtualFirmas2/EduVirtualFirmas2.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o output
      - uses: actions/upload-artifact@v4
        with:
          name: EduVirtualFirmas2-Experimental-Windows
          path: output/
